<!doctype html>
<html lang="es">
<head>
<title>Recursos · Docentes 4.0</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<link rel="stylesheet" href="../comun/gt.css">
<script src="../comun/api.js"></script>
<script src="../comun/gt.js"></script>
<style>
  .cab { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
  .cab p { color: var(--suave); }
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .filtros input { font: inherit; padding: 8px 12px; border: 1px solid var(--linea); border-radius: 8px; background: var(--papel); color: var(--tinta); flex: 1 1 220px; min-width: 0; }
  .filtros button { font: inherit; font-size: .88rem; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--linea); background: var(--papel); color: var(--suave); cursor: pointer; }
  .filtros button[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); color: var(--papel); }
  .lista { display: flex; flex-direction: column; border-top: 1px solid var(--linea); }
  .recurso { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--linea); }
  .tipo { font-size: .8rem; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .05em; }
  .t { font-weight: 700; } .d { font-size: .9rem; color: var(--suave); } .autor { font-size: .82rem; color: var(--suave); }
  @media (max-width: 640px) { .recurso { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div class="envoltura">
  <div class="barra-sup"><button class="tema" data-gt-tema></button></div>
  <div class="cab"><h2>Recursos del grupo</h2><p id="cuenta"></p></div>
  <div class="barra">
    <p>¿Tienes algo que compartir? Entra con tu cuenta educaand y propónlo: Julio lo revisa antes de publicarlo.</p>
    <div class="acciones"><a class="boton" id="compartir">Compartir un recurso</a><a class="boton claro" id="pedir">Pedir acceso</a></div>
  </div>
  <div class="filtros"><input type="search" id="buscar" placeholder="Buscar: rúbrica, DUA, Séneca…" aria-label="Buscar recursos"><div id="tipos" style="display:flex;flex-wrap:wrap;gap:6px"></div></div>
  <div class="lista" id="lista"><p class="estado">Cargando los recursos…</p></div>
</div>
<script>
(function () {
  GT.tema();
  var comp = document.getElementById('compartir'), pedir = document.getElementById('pedir');
  if (GT.app('recursos')) { GT.enlace(comp, GT.app('recursos')); GT.enlace(pedir, GT.app('pedir')); } else { comp.hidden = pedir.hidden = true; }
  var todos = [], filtro = 'Todos', buscar = document.getElementById('buscar');
  function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function pintarTipos() {
    var caja = document.getElementById('tipos'); caja.textContent = '';
    ['Todos'].concat(todos.map(function (r) { return r.tipo; }).filter(function (t, i, a) { return a.indexOf(t) === i; })).forEach(function (t) {
      var b = GT.el('button', null, t); b.type = 'button'; b.setAttribute('aria-pressed', t === filtro ? 'true' : 'false');
      b.addEventListener('click', function () { filtro = t; pintarTipos(); pintar(); }); caja.appendChild(b);
    });
  }
  function pintar() {
    var q = norm(buscar.value.trim()), caja = document.getElementById('lista'); caja.textContent = '';
    var lista = todos.filter(function (r) { return (filtro === 'Todos' || r.tipo === filtro) && (!q || norm(r.titulo + ' ' + r.descripcion + ' ' + r.autor).indexOf(q) >= 0); });
    lista.forEach(function (r) {
      var f = GT.el('div', 'recurso'), m = GT.el('div'); m.style.minWidth = '0';
      f.appendChild(GT.el('span', 'tipo', r.tipo));
      m.appendChild(GT.el('div', 't', r.titulo)); m.appendChild(GT.el('div', 'd', r.descripcion)); m.appendChild(GT.el('div', 'autor', 'Aporta: ' + r.autor));
      f.appendChild(m); f.appendChild(GT.enlace(GT.el('a', 'boton claro', 'Abrir'), r.enlace)); caja.appendChild(f);
    });
    if (!lista.length) caja.appendChild(GT.el('p', 'estado', todos.length ? 'No hay recursos con ese filtro. Prueba con otra palabra.' : 'Todavía no hay recursos.'));
    document.getElementById('cuenta').textContent = lista.length + ' de ' + todos.length;
  }
  buscar.addEventListener('input', pintar);
  GT.leer('recursos').then(function (d) { todos = d.recursos; pintarTipos(); pintar(); }).catch(function () {
    var caja = document.getElementById('lista'); caja.textContent = ''; caja.appendChild(GT.el('p', 'estado', 'Ahora mismo no se pueden cargar los recursos. Vuelve a intentarlo dentro de un rato.'));
  });
})();
</script>
</body>
</html>
